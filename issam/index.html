:root {
  --sky1:#47bfff;
  --sky2:#c6efff;
  --hill1:#66d16c;
  --hill2:#3fb456;
  --ink:#1f2a44;
  --soft:#5b6782;
  --red:#e8413c;
  --gold:#ffc93c;
  --blue:#2f6fe4;
  --green:#2fbf71;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
  color-scheme: light;
}
:root[data-theme=dark],
:root[data-theme=light] {
  color-scheme: light;
}
* {
  box-sizing: border-box;
  min-width: 0;
  -webkit-tap-highlight-color: transparent;
}
html,
body {
  height: 100%;
  margin: 0;
}
body {
  font:
    600 17px/1.4 "Baloo 2",
    "Arial Rounded MT Bold",
    ui-rounded,
    system-ui,
    sans-serif;
  color: var(--ink);
  background: var(--sky1);
  overflow: hidden;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  overscroll-behavior: none;
}
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}
button:focus-visible {
  outline: 4px solid var(--blue);
  outline-offset: 3px;
}
body[data-decor=couchant] {
  --sky1:#ff8f5e;
  --sky2:#ffdca6;
  --hill1:#71c96a;
  --hill2:#4a9f50;
}
body[data-decor=nuit] {
  --sky1:#1c2b6e;
  --sky2:#5266c2;
  --hill1:#2f9a60;
  --hill2:#1f7347;
}
#sky {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: 0;
  background:
    linear-gradient(
      180deg,
      var(--sky1),
      var(--sky2) 75%);
  overflow: hidden;
  pointer-events: none;
}
#sky .clouds {
  position: absolute;
  top: 8%;
  left: 0;
  width: 200%;
  height: 30%;
  animation: drift 80s linear infinite;
}
#sky .hills {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  height: 26%;
}
#sky .nightstars {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 60%;
  display: none;
}
body[data-decor=nuit] #sky .nightstars {
  display: block;
}
body[data-decor=nuit] #sky .clouds {
  opacity: .25;
}
@keyframes drift {
  to {
    transform: translateX(-50%);
  }
}
#app {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: 1;
  display: flex;
  flex-direction: column;
  padding: calc(var(--sat) + 6px) calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px);
}
#bar {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 66px;
  flex: none;
}
.round {
  width: 58px;
  height: 58px;
  flex: none;
  border-radius: 50%;
  border: 0;
  background: #fff;
  box-shadow: 0 5px 0 rgba(0, 0, 0, .16);
  display: grid;
  place-items: center;
  color: var(--ink);
  padding: 0;
}
.round:active,
.wcard:active,
.choice:active,
.big:active,
.tile:active {
  transform: translateY(3px);
  box-shadow: 0 2px 0 rgba(0, 0, 0, .16);
}
.round svg {
  width: 32px;
  height: 32px;
}
.round[hidden] {
  display: none;
}
#stars {
  margin-inline-start: auto;
  background: #fff;
  border-radius: 32px;
  padding: 4px 18px 4px 8px;
  display: flex;
  align-items: center;
  gap: 6px;
  font: 800 28px/1 "Baloo 2", sans-serif;
  box-shadow: 0 5px 0 rgba(0, 0, 0, .16);
  height: 54px;
}
#stars svg {
  width: 38px;
  height: 38px;
}
#stars.pop {
  animation: pop .6s;
}
#btnListen.talking {
  animation: glow 1s infinite;
}
#btnParents {
  width: auto;
  border-radius: 30px;
  padding: 0 14px;
  gap: 6px;
  display: flex;
  font-size: 14px;
  font-weight: 700;
  color: var(--soft);
  height: 44px;
  box-shadow: 0 4px 0 rgba(0, 0, 0, .12);
}
#btnParents[hidden] {
  display: none;
}
#btnParents svg {
  width: 20px;
  height: 20px;
}
#stage {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
  -webkit-overflow-scrolling: touch;
  padding: 6px 0 calc(var(--sab) + 100px);
}
#guide {
  position: fixed;
  left: calc(var(--sal) + 8px);
  bottom: calc(var(--sab) + 8px);
  display: flex;
  align-items: flex-end;
  gap: 6px;
  pointer-events: none;
  z-index: 6;
  max-width: calc(100% - 24px);
}
#lumi {
  width: 66px;
  height: 66px;
  flex: none;
  animation: bob 3s ease-in-out infinite;
}
#bubble {
  background: #fff;
  border-radius: 20px 20px 20px 6px;
  padding: 8px 14px;
  margin: 0 0 34px;
  font-size: 17px;
  line-height: 1.3;
  box-shadow: 0 4px 0 rgba(0, 0, 0, .12);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity .25s, transform .25s;
  max-width: 300px;
}
#bubble.show {
  opacity: 1;
  transform: none;
}
.start {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  text-align: center;
}
.title {
  font: 800 clamp(30px, 8.5vw, 48px)/1.02 "Baloo 2", sans-serif;
  color: #fff;
  text-shadow:
    0 3px 0 #1c5fa8,
    0 0 2px #1c5fa8,
    0 0 14px rgba(28, 95, 168, .55);
  margin: 0;
  text-wrap: balance;
}
.title small {
  display: block;
  font-size: .55em;
  color: #fffbe6;
}
.hero-stage {
  position: relative;
  width: 100%;
  max-width: 520px;
  height: clamp(190px, 34vh, 320px);
  display: flex;
  justify-content: center;
  align-items: flex-end;
  margin: 0 auto;
}
.hero-stage .hero {
  height: 100%;
  width: auto;
  animation: bob 3.4s ease-in-out infinite;
  filter: drop-shadow(0 6px 0 rgba(0, 0, 0, .08));
}
.play-btn {
  width: 128px;
  height: 128px;
  border-radius: 50%;
  border: 0;
  background: var(--red);

#fx {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  pointer-events: none;
  z-index: 8;
  overflow: hidden;
}
.spark {
  position: absolute;
  width: 34px;
  height: 34px;
  animation: fly 1s ease-out forwards;
}
@keyframes fly {
  0% {
    transform: translate(0, 0) scale(.4) rotate(0);
    opacity: 1;
  }
  100% {
    transform: translate(var(--dx), var(--dy)) scale(1) rotate(200deg);
    opacity: 0;
  }
}
@keyframes pop {
  0% {
    transform: scale(1);
  }
  40% {
    transform: scale(1.18);
  }
  100% {
    transform: scale(1);
  }
}
@keyframes shake {
  0%, 100% {
    transform: translateX(0);
  }
  25% {
    transform: translateX(-8px);
  }
  75% {
    transform: translateX(8px);
  }
}
@keyframes glow {
  50% {
    transform: scale(1.06);
  }
}
@keyframes bob {
  50% {
    transform: translateY(-6px);
  }
}
#modal {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: 20;
  background: rgba(20, 30, 60, .55);
  display: grid;
  place-items: center;
  padding: 20px;
}

  display: none;
}
.dialog {
  background: #fff;

<script>
(function(root) {
  const Logic = {};
  Logic.rand = (a, b, r = Math.random) => a + Math.floor(r() * (b - a + 1));
  Logic.pick = (arr, r = Math.random) => arr[Math.floor(r() * arr.length)];
  Logic.shuffle = (arr, r = Math.random) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  Logic.sample = (arr, n, r) => Logic.shuffle(arr, r).slice(0, n);
  Logic.nearNumbers = (t, n, min, max, r) => {
    const c = [];
    for (let x = min; x <= max; x++) if (x !== t) c.push(x);
    c.sort((a, b) => Math.abs(a - t) - Math.abs(b - t));
    return Logic.sample(c.slice(0, Math.max(n, 4)), n, r);

<script>
{
  let loadState2 = function() {

  }, audio2 = function() {
    if (!S.settings.sound) return null;
    try {
      if (!actx) {
        const C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        actx = new C();
      }
      if (actx.state === "suspended") actx.resume();
      return actx;
    } catch (e) {
      return null;
    }
  }, tone2 = function(f, t0, dur, type = "sine", vol = 0.1) {
    const a = audio2();
    if (!a) return;
    try {
      const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
      o.type = type;
      o.frequency.value = f;
      g.gain.setValueAtTime(1e-4, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
      g.gain.exponentialRampToValueAtTime(1e-4, t + dur);
      o.connect(g);
      g.connect(a.destination);
      o.start(t);
      o.stop(t + dur + 0.05);
    } catch (e) {
    }
  }, voiceScore2 = function(v) {
    let sc = 0;
    if (/premium|enhanced|am[ée]lior|neural|natural|siri/i.test(v.name)) sc += 5;
    if (/fr[-_]FR/i.test(v.lang)) sc += 2;
    if (/Am[ée]lie|Audrey|Aur[ée]lie|Marie|Denise|Google/i.test(v.name)) sc += 1;
    if (/Jacques|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley|Bahh|Albert|Bad|Bells|Boing|Bubbles|Cellos|Good|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox/i.test(v.name)) sc -= 6;
    return sc;
  }, frVoices2 = function() {

      return [];

  }, pickVoice2 = function() {
    const vs = frVoices2();
    if (!vs.length) {

  }, showBubble2 = function(text) {

  }, say2 = function(text, done) {

      if (fired) return;

      btn.classList.remove("talking");
      if (done) done();
    };
    if (S.settings.voice && droid) {
      try {
        droid.speak(text.replace(/[«»"]/g, ""), S.settings.rate || 0.95, S.settings.pitch || 1);
      } catch (e) {
      }
      btn.classList.add("talking");
      setTimeout(end, 900 + text.length * 70);
      return;

    if (!S.settings.voice || !synth) {
      setTimeout(end, Math.min(2500, 500 + text.length * 40));
      return;
    }
    try {
      synth.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/[«»"]/g, ""));
      u.lang = frVoice ? frVoice.lang : "fr-FR";
      if (frVoice) u.voice = frVoice;
      u.rate = S.settings.rate || 0.95;
      u.pitch = S.settings.pitch || 1;
      u.onend = end;

      setTimeout(end, 1200 + text.length * 95);

    } catch (e) {
      end();
    }
  }, instruct2 = function(text, done) {
